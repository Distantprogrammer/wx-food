<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>推送记录 - 今天做什么菜</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/sub.css" />
</head>
<body class="mock-page">
  <div class="phone-frame">
    <div class="phone-screen">
      <header class="page-header">
        <div class="status-bar light"><span class="time">9:41</span><span class="icons">▮▮▮ 📶</span></div>
        <div class="page-header__bar">
          <div class="page-header__btn">‹</div>
          <div class="page-header__title">推送记录</div>
        </div>
        <div class="push-tabs">
          <div class="tab active">我发出的</div>
          <div class="tab">我收到的</div>
        </div>
      </header>
      <div class="page-body no-tab" style="padding-top:12px">
        <div class="push-card">
          <div class="cover placeholder-img">🍛</div>
          <div class="info">
            <div class="title ellipsis">宫保鸡丁</div>
            <div class="meta">推送给 小美 · 今天 12:30</div>
            <div class="msg ellipsis">今晚试试这个？</div>
            <div class="footer">
              <span class="status">已送达</span>
              <div class="links"><span>查看</span></div>
            </div>
          </div>
        </div>
        <div class="push-card">
          <div class="cover placeholder-img">🍜</div>
          <div class="info">
            <div class="title ellipsis">番茄鸡蛋面</div>
            <div class="meta">推送给 阿杰 · 昨天 18:05</div>
            <div class="msg ellipsis">快手晚餐推荐</div>
            <div class="footer">
              <span class="status failed">推送失败</span>
              <div class="links"><span>重试</span><span>查看</span></div>
            </div>
          </div>
        </div>
        <div class="push-card">
          <div class="cover placeholder-img">🥗</div>
          <div class="info">
            <div class="title ellipsis">蒜蓉西兰花</div>
            <div class="meta">推送给 大伟 · 03-18</div>
            <div class="footer">
              <span class="status">已送达</span>
              <div class="links"><span>查看</span></div>
            </div>
          </div>
        </div>
        <div class="load-more end" style="text-align:center;padding:12px;font-size:12px;color:#ccc">— 没有更多了 —</div>
      </div>
    </div>
  </div>
</body>
</html>
