<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首页 - 今天做什么菜</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/main.css" />
</head>
<body class="mock-page">
  <div class="phone-frame">
    <div class="phone-screen">
      <div class="status-bar"><span class="time">9:41</span><span class="icons">▮▮▮ 📶</span></div>
      <div class="page-body">
        <div class="home-header">
          <div class="top">
            <div class="greeting"><span>下午好</span><span>☀️</span></div>
            <div class="avatar avatar-sm"><div class="placeholder-img" style="font-size:16px">😊</div></div>
          </div>
          <div class="meal-banner">
            <span class="title">午餐推荐</span>
            <span class="sub">为您精选 午餐 菜谱</span>
          </div>
        </div>

        <div class="section">
          <div class="h-scroll">
            <div class="recipe-card">
              <div class="cover"><div class="placeholder-img">🥗</div><span class="difficulty-badge easy">简单</span></div>
              <div class="body"><div class="name ellipsis">蒜蓉西兰花</div><div class="meta"><span>⏱️ 15分钟</span></div><div class="tags"><span class="tag">素食</span></div></div>
            </div>
            <div class="recipe-card">
              <div class="cover"><div class="placeholder-img">🍛</div><span class="difficulty-badge medium">中等</span></div>
              <div class="body"><div class="name ellipsis">红烧排骨</div><div class="meta"><span>⏱️ 45分钟</span></div><div class="tags"><span class="tag">家常</span></div></div>
            </div>
            <div class="recipe-card">
              <div class="cover"><div class="placeholder-img">🍜</div><span class="difficulty-badge easy">简单</span></div>
              <div class="body"><div class="name ellipsis">番茄鸡蛋面</div><div class="meta"><span>⏱️ 20分钟</span></div><div class="tags"><span class="tag">快手</span></div></div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-head">
            <span class="section-title">🎲 随机选菜</span>
            <div class="category-tabs-inline">
              <span class="pill-tab active">🔥 热门</span>
              <span class="pill-tab">🥩 荤菜</span>
              <span class="pill-tab">🥬 素菜</span>
              <span class="pill-tab">🍲 汤羹</span>
            </div>
          </div>
          <div class="slot-machine">
            <div class="slot-window">
              <div class="placeholder-img">🍱</div>
              <div class="name">宫保鸡丁</div>
            </div>
            <button class="btn btn-primary btn-block btn-lg"><span>🎰</span><span>帮我随机</span></button>
          </div>
        </div>

        <div class="section">
          <div class="section-head">
            <span class="section-title">🔥 热门菜谱</span>
            <span class="section-more">查看更多 →</span>
          </div>
          <div class="recipe-grid">
            <div class="recipe-card">
              <div class="cover"><div class="placeholder-img">🐟</div><span class="difficulty-badge medium">中等</span></div>
              <div class="body"><div class="name ellipsis">香煎三文鱼</div><div class="meta"><span>⏱️ 25分钟</span><span>👁 1.2k</span></div></div>
            </div>
            <div class="recipe-card">
              <div class="cover"><div class="placeholder-img">🥩</div><span class="difficulty-badge hard">困难</span></div>
              <div class="body"><div class="name ellipsis">牛排配时蔬</div><div class="meta"><span>⏱️ 40分钟</span><span>👁 980</span></div></div>
            </div>
            <div class="recipe-card">
              <div class="cover"><div class="placeholder-img">🥘</div><span class="difficulty-badge easy">简单</span></div>
              <div class="body"><div class="name ellipsis">麻婆豆腐</div><div class="meta"><span>⏱️ 20分钟</span><span>👁 2.1k</span></div></div>
            </div>
            <div class="recipe-card">
              <div class="cover"><div class="placeholder-img">🍲</div><span class="difficulty-badge easy">简单</span></div>
              <div class="body"><div class="name ellipsis">西红柿蛋汤</div><div class="meta"><span>⏱️ 15分钟</span><span>👁 860</span></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <nav class="tabbar">
      <div class="tab-item active"><span class="tab-icon">🏠</span><span>首页</span></div>
      <div class="tab-item"><span class="tab-icon">📖</span><span>烹饪技巧</span></div>
      <div class="tab-item"><span class="tab-icon">📂</span><span>分类</span></div>
      <div class="tab-item"><span class="tab-icon">👥</span><span>关系</span></div>
      <div class="tab-item"><span class="tab-icon">👤</span><span>我的</span></div>
    </nav>
  </div>
</body>
</html>
