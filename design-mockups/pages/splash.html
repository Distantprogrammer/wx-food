<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>启动页 - 今天做什么菜</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/main.css" />
</head>
<body class="mock-page">
  <div class="phone-frame">
    <div class="phone-screen">
      <div class="splash-bg">
        <div class="placeholder-img">🍳</div>
        <div class="overlay"></div>
      </div>
      <div class="status-bar"><span class="time">9:41</span><span class="icons">▮▮▮ 📶</span></div>
      <div class="splash-content page-body no-tab">
        <div class="app-logo">
          <span class="logo-icon">🍳</span>
          <span class="logo-text">今天做什么菜</span>
          <span class="logo-sub">每天都是美食日</span>
        </div>
        <div class="banner-block">
          <div class="placeholder-img">🥘</div>
          <div class="info">
            <span class="t">周末家宴灵感</span>
            <span class="s">轻松做出一桌好菜</span>
          </div>
        </div>
        <div style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">
          <span class="section-title" style="font-size:18px">今日推荐</span>
          <span>✨</span>
        </div>
        <div class="recommend-card">
          <div class="placeholder-img">🍜</div>
          <div class="info">
            <div class="name">番茄鸡蛋面</div>
            <div class="meta"><span>⏱️ 20分钟</span><span>🔥 320kcal</span></div>
          </div>
        </div>
        <div style="margin-top:30px">
          <div class="btn btn-primary btn-block btn-lg">5 秒后进入</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
