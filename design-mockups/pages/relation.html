<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的关系 - 今天做什么菜</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/main.css" />
</head>
<body class="mock-page">
  <div class="phone-frame">
    <div class="phone-screen">
      <header class="page-header">
        <div class="status-bar light"><span class="time">9:41</span><span class="icons">▮▮▮ 📶</span></div>
        <div class="page-header__bar"><div class="page-header__title">我的关系</div></div>
      </header>
      <div class="relation-page page-body">
        <div class="mp-bind-card">
          <div class="main">
            <span class="title">📢 绑定公众号接收推送</span>
            <span class="desc">关注公众号后，好友推送的菜品才能通过微信通知你</span>
          </div>
          <span class="action">去绑定</span>
        </div>
        <div class="stats-card" style="margin-bottom:12px">
          <div class="stat-item"><span class="stat-value">3</span><span class="stat-label">已关联</span></div>
          <div class="stat-divider"></div>
          <div class="stat-item"><span class="stat-value">1</span><span class="stat-label">待确认</span></div>
          <div class="stat-divider"></div>
          <div class="stat-item"><span class="stat-value">12</span><span class="stat-label">已推送</span></div>
          <div class="stat-divider"></div>
          <div class="stat-item"><span class="stat-value">5</span><span class="stat-label">收到推送</span></div>
        </div>
        <div class="action-row">
          <button class="btn btn-primary">添加关联</button>
          <button class="btn btn-outline">推送记录</button>
        </div>
        <div class="relation-card">
          <div class="relation-main">
            <div class="avatar avatar-md"><div class="placeholder-img" style="font-size:20px">👩</div></div>
            <div class="peer-info">
              <span class="name">小美</span>
              <span class="status">已关联</span>
            </div>
          </div>
          <div class="relation-actions">
            <button class="btn btn-sm btn-muted">权限</button>
            <button class="btn btn-sm btn-danger">解除</button>
          </div>
        </div>
        <div class="relation-card">
          <div class="relation-main">
            <div class="avatar avatar-md"><div class="placeholder-img" style="font-size:20px">👨</div></div>
            <div class="peer-info">
              <span class="name">阿杰</span>
              <span class="status">已关联</span>
              <span class="warn">对方未关注公众号，推送可能失败</span>
            </div>
          </div>
          <div class="relation-actions">
            <button class="btn btn-sm btn-muted">权限</button>
            <button class="btn btn-sm btn-danger">解除</button>
          </div>
        </div>
        <div class="relation-card">
          <div class="relation-main">
            <div class="avatar avatar-md"><div class="placeholder-img" style="font-size:20px">🧑</div></div>
            <div class="peer-info">
              <span class="name">小林</span>
              <span class="status pending">待确认 · 等待对方确认</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <nav class="tabbar">
      <div class="tab-item"><span class="tab-icon">🏠</span><span>首页</span></div>
      <div class="tab-item"><span class="tab-icon">📖</span><span>烹饪技巧</span></div>
      <div class="tab-item"><span class="tab-icon">📂</span><span>分类</span></div>
      <div class="tab-item active"><span class="tab-icon">👥</span><span>关系</span></div>
      <div class="tab-item"><span class="tab-icon">👤</span><span>我的</span></div>
    </nav>
  </div>
</body>
</html>
