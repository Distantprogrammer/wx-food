<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>绑定公众号 - 今天做什么菜</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/sub.css" />
</head>
<body class="mock-page">
  <div class="phone-frame">
    <div class="phone-screen">
      <header class="page-header">
        <div class="status-bar light"><span class="time">9:41</span><span class="icons">▮▮▮ 📶</span></div>
        <div class="page-header__bar">
          <div class="page-header__btn">‹</div>
          <div class="page-header__title">绑定公众号</div>
        </div>
      </header>
      <div class="social-content page-body no-tab">
        <div class="method-card">
          <div class="mtitle">方式一：扫码关注</div>
          <div class="mdesc">长按识别或截图后用微信扫一扫</div>
          <div class="qrcode-box">▦</div>
          <div class="expire-tip">二维码 5 分钟内有效</div>
          <button class="btn btn-outline btn-block" style="margin-bottom:8px">刷新二维码</button>
          <button class="btn btn-primary btn-block">我已关注，检查绑定</button>
          <div class="expire-tip">正在轮询绑定状态…</div>
        </div>
        <div class="method-card">
          <div class="mtitle">方式二：网页授权</div>
          <div class="mdesc">跳转微信授权页完成绑定</div>
          <button class="btn btn-outline btn-block">前往授权绑定</button>
        </div>
        <div class="tips-list">
          <div class="ttitle">温馨提示</div>
          <div class="titem">1. 绑定后才能收到好友推送的菜品通知</div>
          <div class="titem">2. 请使用当前登录微信关注公众号</div>
          <div class="titem">3. 如遇问题可尝试刷新二维码后重试</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
