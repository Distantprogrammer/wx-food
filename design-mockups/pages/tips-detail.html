          <div class="article-summary">掌握基础刀工，让备料更高效、成品更美观。本文介绍常见切法与安全要点。</div>
          <div class="markdown-body">
            <h3>一、刀具选择</h3>
            <p>家用推荐一把 18–21cm 的厨师刀，刃口锋利、重心适中。切菜前确保砧板稳固，可在下方垫湿布防滑。</p>
            <h3>二、基础握刀</h3>
            <p>拇指与食指捏住刀脊靠近刀刃处，其余三指握住刀柄。左手呈爪形按住食材，指关节抵住刀面引导进刀。</p>
            <h3>三、常见切法</h3>
            <p>切丝、切丁、切片时保持厚度均匀。切洋葱可先对半切开，再纵向切丝；切土豆丝建议先切片再叠切。</p>
            <h3>四、安全提示</h3>
            <p>切完后立即收刀。清洗刀具时刀刃朝外，不要将刀浸泡在水槽中。钝刀更危险，定期磨刀。</p>
          </div>
