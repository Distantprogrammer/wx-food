<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>菜谱详情 - 今天做什么菜</title>
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/sub.css" />
</head>
<body class="mock-page">
  <div class="phone-frame">
    <div class="phone-screen">
      <header class="page-header" style="position:absolute;top:0;left:0;right:0;background:transparent;z-index:30">
        <div class="status-bar light"><span class="time">9:41</span><span class="icons">▮▮▮ 📶</span></div>
        <div class="page-header__bar">
          <div class="page-header__btn" style="background:rgba(0,0,0,0.3);border-radius:50%">‹</div>
          <div class="page-header__title">菜谱详情</div>
        </div>
      </header>
      <div class="cover-section">
        <div class="placeholder-img">🍛</div>
        <div class="overlay"></div>
        <div class="cover-info">
          <span class="recipe-name">宫保鸡丁</span>
          <div class="recipe-meta">
            <span>⏱️ 30分钟</span>
            <span>⭐ 中等</span>
            <span>🔥 420kcal</span>
            <span>👥 2人份</span>
          </div>
        </div>
      </div>
      <div class="action-bar">
        <div class="action-item active"><span class="icon">❤️</span><span>已喜欢</span></div>
        <div class="action-item"><span class="icon">☆</span><span>收藏</span></div>
        <div class="action-item"><span class="icon">👨‍🍳</span><span>标记做过</span></div>
        <div class="action-item"><span class="icon">📨</span><span>推给TA</span></div>
        <div class="action-item"><span class="icon">📤</span><span>分享</span></div>
      </div>
      <div class="detail-content page-body no-tab" style="padding-bottom:80px">
        <div class="section-card">
          <div class="section-head"><span>📝</span><span class="title">菜品介绍</span></div>
          <p class="desc">经典川菜，花生脆香、鸡丁滑嫩，酸甜微辣，下饭神器。</p>
        </div>
        <div class="section-card">
          <div class="section-head"><span>🥬</span><span class="title">食材清单</span><span class="count">6 种</span></div>
          <div class="ingredient-item checked"><div class="checkbox">✓</div><span class="iname">鸡胸肉</span><span class="qty">300g</span></div>
          <div class="ingredient-item"><div class="checkbox"></div><span class="iname">花生米</span><span class="qty">50g</span></div>
          <div class="ingredient-item"><div class="checkbox"></div><span class="iname">干辣椒</span><span class="qty">8个</span></div>
          <div class="ingredient-item"><div class="checkbox"></div><span class="iname">葱姜蒜</span><span class="qty">适量</span></div>
          <div class="ingredient-item"><div class="checkbox"></div><span class="iname">酱油</span><span class="qty">2勺</span></div>
          <div class="ingredient-item"><div class="checkbox"></div><span class="iname">糖醋</span><span class="qty">各1勺</span></div>
        </div>
        <div class="section-card">
          <div class="section-head"><span>👩‍🍳</span><span class="title">烹饪步骤</span><span class="count">4 步</span></div>
          <div class="step-item"><div class="step-num">1</div><div class="step-text">鸡胸肉切丁，用料酒、淀粉、盐腌制 15 分钟。</div></div>
          <div class="step-item"><div class="step-num">2</div><div class="step-text">热锅少油，炸香花生米捞出备用。</div></div>
          <div class="step-item"><div class="step-num">3</div><div class="step-text">爆香干辣椒、花椒，下鸡丁快速翻炒至变色。</div></div>
          <div class="step-item"><div class="step-num">4</div><div class="step-text">倒入调味汁，撒入花生米翻匀即可出锅。</div></div>
        </div>
      </div>
      <div class="bottom-bar">
        <div class="nav-btns"><div class="btn">🏠</div><div class="btn">📂</div></div>
        <button class="btn btn-primary btn-lg cook-btn">开始做菜</button>
      </div>
    </div>
  </div>
</body>
</html>
